<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="app-wrapper">
        <main class="container" id="game-container">
            <header>
                <h1>SUDOKU <span class="glow">ZEN</span></h1>
                <div class="status-bar">
                    <div class="timer">00:00</div>
                </div>
            </header>

            <div class="game-area">
                <div id="sudoku-board" class="board"></div>

                <div class="controls">
                    <div class="numpad">
                        <button class="num-btn" data-num="1">1</button>
                        <button class="num-btn" data-num="2">2</button>
                        <button class="num-btn" data-num="3">3</button>
                        <button class="num-btn" data-num="4">4</button>
                        <button class="num-btn" data-num="5">5</button>
                        <button class="num-btn" data-num="6">6</button>
                        <button class="num-btn" data-num="7">7</button>
                        <button class="num-btn" data-num="8">8</button>
                        <button class="num-btn" data-num="9">9</button>
                        <button class="action-btn" id="erase-btn">Effacer</button>
                    </div>

                    <div class="difficulty-selector">
                        <button class="diff-btn active" data-diff="easy">Facile</button>
                        <button class="diff-btn" data-diff="medium">Moyen</button>
                        <button class="diff-btn" data-diff="hard">Difficile</button>
                        <button class="diff-btn" data-diff="expert">Expert</button>
                    </div>

                    <button id="new-game-btn" class="new-game-btn">Nouvelle Partie</button>
                    <button id="media-toggle-btn" class="media-btn">📺 Mode Multitâche</button>
                </div>
            </div>
        </main>

        <div id="resizer" class="resizer hidden"></div>

        <aside id="media-container" class="media-container hidden">
            <div class="media-controls">
                <input type="text" id="media-url" placeholder="Lien YouTube ou Twitch...">
                <button id="load-media-btn">Charger</button>
                <button id="close-media-btn" class="close-btn">×</button>
            </div>
            <div class="video-wrapper">
                <iframe id="media-frame" src="" frameborder="0" allowfullscreen></iframe>
                <div class="placeholder-text">Collez un lien pour commencer</div>
            </div>
        </aside>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Partie Terminée!</h2>
            <p id="modal-message">Félicitations!</p>
            <button id="modal-close-btn">Fermer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
